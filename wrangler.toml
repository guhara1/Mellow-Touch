# 나울 — 클라우드플레어 **Pages** 배포 설정
#
# ★이 저장소는 정적 파일만 들어 있다. 빌드 과정이 없다 —
#   HTML 3,242장이 public/ 에 이미 구워져 있고, Pages 는 그 폴더를 그대로 서빙한다.
# ★Pages 는 wrangler.toml 에 `pages_build_output_dir` 가 **없으면**
#   이 파일을 Workers 설정으로 읽고 빌드를 거부한다. 그래서 이 줄이 핵심이다.
name = "mellow-touch"
compatibility_date = "2026-10-12"
pages_build_output_dir = "./public"
